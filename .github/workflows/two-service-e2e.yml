name: Two-service moderation E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  moderation-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moderation_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moderation_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRESQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/moderation_e2e
      E2E_AI_MODERATOR_ROOT: ${{ github.workspace }}/AI-Moderator
    steps:
      - name: Check out OmniBot
        uses: actions/checkout@v4
        with:
          path: discord-bot
      - name: Check out AI Moderator
        uses: actions/checkout@v4
        with:
          repository: 6oT9lpa/AI-Moderation-Content
          path: AI-Moderator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and adapter dependencies
        run: >-
          python -m pip install alembic fastapi httpx psycopg pydantic
          pydantic-settings uvicorn PyYAML Pillow numpy SQLAlchemy pytest pytest-asyncio psutil
      - name: Run migration and atomicity integration tests
        working-directory: AI-Moderator
        run: python -m pytest tests/integration/test_dataset_transaction.py tests/integration/test_postgresql_media_policy_repository.py -q
      - name: Run OmniBot to AI Moderator roundtrip
        working-directory: discord-bot
        run: python -m pytest tests/e2e/test_ai_moderator_feedback_roundtrip.py -q
