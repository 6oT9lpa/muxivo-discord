name: Discord quality

on:
  pull_request:
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d discord_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISCORD_TOKEN: ci-placeholder-token
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/discord_test
      POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/discord_test
    steps:
      - name: Check out Muxivo Discord
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q activity application core infrastructure
      - name: Run Discord regression tests
        run: python -m pytest tests --ignore=tests/e2e -q
